<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Albatros — Zapisy na treningi</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="bg-video-wrap" aria-hidden="true">
  <video id="bg-video-a" class="bg-video" muted loop playsinline></video>
  <video id="bg-video-b" class="bg-video" muted loop playsinline></video>
  <div class="bg-overlay"></div>
</div>

<div id="demo-banner" class="demo-banner" hidden>
  ⚠️ Tryb demo: Firebase nie jest jeszcze skonfigurowany, więc zapisy widzisz tylko Ty, na tym urządzeniu.
  Instrukcja w pliku <code>js/firebase-config.js</code> i <code>README.md</code>.
</div>

<header class="site-header">
  <img id="logo-img" alt="Logo Albatros" class="logo" />
  <div class="header-text">
    <h1>Albatros</h1>
    <p>Zapisy na treningi i mecze</p>
  </div>
</header>

<main>
  <section class="card identity-card">
    <div id="identity-bar" class="identity-bar"></div>
  </section>

  <section class="card">
    <h2>Plan na najbliższy tydzień</h2>
    <div id="schedule-list" class="schedule-list"></div>
  </section>

  <section class="card">
    <div id="roster-panel" class="roster-panel"></div>
  </section>
</main>

<footer class="site-footer">
  <p>KS Albatros · strona zrobiona przez klub, dla klubu ⚽</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
